<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-MONSTAR 銷量與庫存監控</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; text-align: center; padding: 50px; }
        .card { background: white; max-width: 400px; margin: 0 auto; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        button { background-color: #ff4b4b; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #e03e3e; }
        #count { font-size: 24px; font-weight: bold; color: #ff4b4b; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>⭐ K-MONSTAR 庫存監控</h1>
        <p>目前商品即時狀態：<strong>販售中</strong></p>
        <div id="count">點擊次數：0</div>
        <button onclick="addClick()">模擬更新庫存</button>
    </div>
    <script>
        let count = 0;
        function addClick() {
            count++;
            document.getElementById('count').innerText = "點擊次數：" + count;
        }
    </script>
</body>
</html>
