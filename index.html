<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seoul Focus & Vibe — 韓語沉浸學習 Web App</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      /* Light Mode Palette (Morandi Pastel) */
      --bg-gradient: linear-gradient(135deg, #f5f3f8 0%, #e8e3f0 100%);
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(255, 255, 255, 0.6);
      --text-main: #332d41;
      --text-sub: #786f8a;
      --accent-purple: #8b79b8;
      --accent-purple-hover: #7563a3;
      --accent-rose: #e09fbe;
      --accent-mint: #88c0a8;
      --shadow-sm: 0 8px 32px 0 rgba(115, 102, 142, 0.08);
      --shadow-md: 0 12px 40px 0 rgba(115, 102, 142, 0.15);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 10px;
    }

    [data-theme="dark"] {
      /* Dark Mode Palette */
      --bg-gradient: linear-gradient(135deg, #181524 0%, #0d0b14 100%);
      --card-bg: rgba(30, 26, 43, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f0ecf7;
      --text-sub: #a197b8;
      --accent-purple: #9d8ec4;
      --accent-purple-hover: #b1a3d6;
      --accent-rose: #eb95b8;
      --accent-mint: #70be9a;
      --shadow-sm: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --shadow-md: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    /* Glassmorphism Container */
    .app-container {
      width: 100%;
      max-width: 960px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 32px;
      margin-top: 16px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title i {
      font-size: 1.8rem;
      color: var(--accent-purple);
    }

    .brand-title h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-title span {
      font-size: 0.85rem;
      color: var(--accent-purple);
      background: rgba(139, 121, 184, 0.15);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle-btn {
      background: rgba(139, 121, 184, 0.12);
      border: none;
      color: var(--text-main);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .theme-toggle-btn:hover {
      background: rgba(139, 121, 184, 0.25);
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.04);
      padding: 6px;
      border-radius: 16px;
      margin-bottom: 32px;
    }

    [data-theme="dark"] .nav-tabs {
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: var(--radius-md);
