<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-MONSTAR 銷量與庫存監控</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #ff4b4b; font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }
        .tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 20px; }
        .tab { padding: 10px 20px; cursor: pointer; font-weight: bold; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tab.active { color: #ff4b4b; border-bottom-color: #ff4b4b; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 15px; font-size: 14px; }
        button { background-color: #ff4b4b; color: white; border: none; padding: 10px 20px; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background-color: #e03e3e; }
        .result-box { margin-top: 20px; padding: 15px; background: #f1f3f5; border-radius: 6px; display: none; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; background: #2b8a3e; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⭐ K-MONSTAR 銷量與庫存監控</h1>
        <div class="subtitle">即時追蹤商品頁面庫存與銷售數據</div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab(0)">🔥 進行中活動監控</div>
            <div class="tab" onclick="switchTab(1)">📜 查詢已結束/任意活動</div>
        </div>

        <!-- 標籤一 -->
        <div class="tab-content active" id="content-0">
            <label>輸入商品網址 (URL):</label>
            <input type="text" id="eventUrl" placeholder="https://example.com/product/..." value="https://k-monstar.com/product/sample">
            <button onclick="startMonitor()">開始即時監控</button>

            <div class="result-box" id="resultBox">
                <div class="status-badge" id="statusBadge">販售中</div>
                <p><strong>商品名稱：</strong> <span id="prodName">K-MONSTAR 官方應援周邊</span></p>
                <p><strong>目前剩餘庫存：</strong> <span id="stockQty" style="color: #ff4b4b; font-weight: bold;">42</span> 件</p>
                <p><strong>最後更新時間：</strong> <span id="updateTime">-</span></p>
            </div>
        </div>

        <!-- 標籤二 -->
        <div class="tab-content" id="content-1">
            <label>輸入歷史活動網址查詢:</label>
            <input type="text" id="historyUrl" placeholder="請輸入已結束的活動網址...">
            <button onclick="queryHistory()">查詢歷史紀錄</button>
            <div class="result-box" id="historyResult" style="display: block; margin-top: 20px;">
                <p style="color: #666; text-align: center; margin: 0;">尚無查詢紀錄，請輸入網址開始。</p>
            </div>
        </div>
    </div>

    <script>
        function switchTab(index) {
            const tabs = document.querySelectorAll('.tab');
            const contents = document.querySelectorAll('.tab-content');
            tabs.forEach((t, i) => {
                t.classList.toggle('active', i === index);
                contents[i].classList.toggle('active', i === index);
            });
        }

        function startMonitor() {
            const url = document.getElementById('eventUrl').value;
            if(!url) {
                alert('請先輸入網址！');
                return;
            }
            const box = document.getElementById('resultBox');
            box.style.display = 'block';
            
            // 模擬即時抓取數值
            document.getElementById('stockQty').innerText = Math.floor(Math.random() * 50) + 1;
            const now = new Date();
            document.getElementById('updateTime').innerText = now.toLocaleTimeString();
        }

        function queryHistory() {
            const historyResult = document.getElementById('historyResult');
            historyResult.innerHTML = '<p style="color: #2b8a3e; font-weight: bold; margin: 0;">✅ 歷史數據讀取成功：此活動已於日前結算，總計售出 128 件。</p>';
        }
    </script>
</body>
</html>
